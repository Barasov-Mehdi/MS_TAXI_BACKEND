services:
  api:
    build: .
    ports: ["3000:3000"]
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/taxi
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_SENDER_NAME: ${SMS_SENDER_NAME:-1sms.az}
      OTP_SECRET: ${OTP_SECRET:-change-me-otp}
    depends_on: [mongo]
  worker:
    build: .
    command: node src/queues/worker.js
    environment:
      MONGODB_URI: mongodb://mongo:27017/taxi
    depends_on: [mongo]
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
volumes:
  mongo_data:
